[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "apex-research"
version = "0.1.0"
description = "APEX quantitative research and paper-trading foundation"
requires-python = ">=3.10"
dependencies = ["boto3>=1.34", "websockets>=12"]
[project.optional-dependencies]
dev = ["pytest>=7.4"]
[tool.setuptools.packages.find]
where = ["."]
include = ["apex*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
