<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>APEX · Model Execution Chart</title>
<style>
:root{color-scheme:dark;--bg:#080c14;--panel:#111a28;--line:#26364b;--muted:#93a4bb;--text:#edf3fc;--mint:#75e0bd;--amber:#e9bd6d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#1b3551 0,transparent 50%),var(--bg);color:var(--text);font:14px/1.55 Inter,system-ui,sans-serif}
main{max-width:1200px;margin:auto;padding:24px 18px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:22px;font-weight:850;letter-spacing:.22em}.brand i{color:var(--mint);font-style:normal}.status{color:var(--mint);font-size:11px;letter-spacing:.1em}
.panel{background:linear-gradient(145deg,#151f30,var(--panel));border:1px solid var(--line);border-radius:15px;padding:18px;margin-top:16px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.pair{font-size:18px;font-weight:750}.hint,.note{color:var(--muted);font-size:12px}canvas{width:100%;height:min(62vh,560px);min-height:300px;display:block;background:#0b1320;border-radius:10px;border:1px solid #1d2a3c;margin-top:12px}
.funding{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.funding input{width:180px;background:#0b1320;color:var(--text);border:1px solid var(--line);padding:11px;border-radius:8px;font-size:15px}button{background:var(--mint);color:#06130f;border:0;padding:11px 16px;border-radius:8px;font-weight:750;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.note{margin-top:9px}
@media(max-width:520px){main{padding:16px 10px}.panel{padding:12px}canvas{min-height:260px;height:52vh}.status{font-size:9px}}
</style>
</head>
<body><main>
<header class="head"><div class="brand">APEX<i>.</i></div><div class="status">MODEL-ONLY · DEMO EXECUTION</div></header>
<section class="panel">
 <div class="toolbar"><div><div class="hint">MODEL-SELECTED MARKET</div><div class="pair" id="pair">Waiting for model…</div></div><div class="hint" id="marketState">Loading model chart</div></div>
 <canvas id="chart" width="1400" height="620" aria-label="Candlestick chart used by the autonomous demo model"></canvas>
 <div class="hint" id="chartMeta">The model chooses the market. This chart follows its current selection automatically.</div>
</section>
<section class="panel">
 <div class="hint">VIRTUAL DEMO FUNDS</div>
 <div class="funding" style="margin-top:10px"><input id="fundAmount" type="number" min="1" max="100000000" step="1" value="5000" aria-label="Amount of virtual demo funds"><button id="fundButton">Confirm demo funds</button></div>
 <div class="note" id="fundMessage">Enter an amount and confirm. This adds virtual funds only; no payment or real currency is involved.</div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);let activeSymbol='',lastBars=[];
function drawChart(bars){
 const c=$('chart'),ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);
 if(!bars||bars.length<2){ctx.fillStyle='#93a4bb';ctx.font='22px sans-serif';ctx.fillText('Waiting for fresh market candles',28,48);return;}
 const vals=bars.map(x=>Number(x.close)),all=bars.flatMap(x=>[Number(x.high),Number(x.low)]),min=Math.min(...all),max=Math.max(...all),pad=(max-min)*.12||.0001,lo=min-pad,hi=max+pad;
 const y=v=>24+(hi-v)/(hi-lo)*(h-58),step=(w-90)/(bars.length-1),body=Math.max(2,Math.min(10,step*.62));
 ctx.strokeStyle='#223249';ctx.lineWidth=1;
 for(let i=0;i<5;i++){const gy=24+i*(h-58)/4;ctx.beginPath();ctx.moveTo(68,gy);ctx.lineTo(w-12,gy);ctx.stroke();ctx.fillStyle='#8394aa';ctx.font='13px sans-serif';ctx.fillText((hi-(hi-lo)*i/4).toFixed(5),5,gy+4);}
 bars.forEach((b,i)=>{const x=68+i*step,o=Number(b.open),cl=Number(b.close);ctx.strokeStyle=cl>=o?'#75e0bd':'#ff7d87';ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(x,y(Number(b.high)));ctx.lineTo(x,y(Number(b.low)));ctx.stroke();ctx.fillRect(x-body/2,Math.min(y(o),y(cl)),body,Math.max(1,Math.abs(y(o)-y(cl))));});
 function ema(period){const alpha=2/(period+1);let v=vals[0];return vals.map((x,i)=>{if(i)v=alpha*x+(1-alpha)*v;return v;});}
 for(const [p,color] of [[9,'#f2c66d'],[21,'#8ba9ff']]){const a=ema(p);ctx.beginPath();a.forEach((v,i)=>{const x=68+i*step,yy=y(v);i?ctx.lineTo(x,yy):ctx.moveTo(x,yy)});ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();}
 ctx.font='14px sans-serif';ctx.fillStyle='#f2c66d';ctx.fillText('EMA 9',78,18);ctx.fillStyle='#8ba9ff';ctx.fillText('EMA 21',150,18);
}
async function loadChart(symbol){
 if(!symbol)return;activeSymbol=symbol;$('pair').textContent=symbol;$('marketState').textContent='Loading model-selected chart…';
 try{const r=await fetch('/api/agent/chart?symbol='+encodeURIComponent(symbol));const d=await r.json();if(!r.ok)throw Error(d.error||'Chart unavailable');lastBars=d.bars||[];drawChart(lastBars);const b=lastBars.at(-1);$('marketState').textContent=b?'Model chart active':'Waiting for candles';$('chartMeta').textContent=b?'Last completed candle: '+new Date(b.timestamp).toLocaleString()+' · Close: '+Number(b.close).toFixed(5)+' · '+d.interval:'No completed candles available for '+symbol+'.';}
 catch(e){lastBars=[];drawChart([]);$('marketState').textContent='Market data unavailable';$('chartMeta').textContent=e.message;}
}
function chooseModelMarket(s){
 const account=s.account||{},positions=account.open_trades||[],ranked=s.ranked_assets||[];
 const chosen=positions[0]?.symbol||ranked.find(x=>x.signal==='buy'||x.signal==='sell')?.symbol||ranked[0]?.symbol||s.watchlist?.[0]||'';
 if(chosen&&chosen!==activeSymbol)loadChart(chosen);
 if(!chosen){$('pair').textContent='Waiting for model';$('marketState').textContent=s.message||'No market selected';}
}
async function refresh(){try{const r=await fetch('/api/agent/status');const s=await r.json();if(!r.ok)throw Error(s.error||'Agent unavailable');chooseModelMarket(s);}catch(e){$('marketState').textContent=e.message;}}
$('fundButton').addEventListener('click',async()=>{
 const raw=$('fundAmount').value,amount=Number(raw);
 if(!Number.isFinite(amount)||amount<=0||amount>100000000){$('fundMessage').textContent='Enter a valid amount between 1 and 100,000,000.';return;}
 if(!window.confirm('Confirm adding '+amount.toLocaleString('en-US')+' virtual demo funds? No real money will move.'))return;
 $('fundButton').disabled=true;$('fundMessage').textContent='Processing virtual-funds confirmation…';
 try{const r=await fetch('/api/agent/funds',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:String(amount)})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');$('fundMessage').textContent='Confirmed. Virtual demo funds added successfully.';}
 catch(e){$('fundMessage').textContent='Not added: '+e.message;}
 finally{$('fundButton').disabled=false;}
});
refresh();setInterval(refresh,10000);setInterval(()=>activeSymbol&&loadChart(activeSymbol),30000);
</script></body></html>
