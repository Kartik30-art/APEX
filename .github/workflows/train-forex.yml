name: Train and validate APEX Forex models

on:
  push:
    branches: [main]
    paths:
      - "apex/forex_data.py"
      - "apex/forex_ml.py"
      - "apex/train_forex.py"
      - "apex/forex_backtest.py"
      - "apex/backtest_forex.py"
      - "apex/forex_models_v2.py"
      - "apex/backtest_forex_v2.py"
      - "apex/backtest_forex_v3.py"
      - "tests/test_forex_models_v3.py"
      - "docs/FOREX_MODEL_V3.md"
      - ".github/workflows/train-forex.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-validate:
    name: Validate ${{ matrix.slug }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - symbol: EURUSD=X
            slug: eurusd
            csv: EURUSD_X_1h.csv
            daily_csv: EURUSD_X_1d.csv
          - symbol: GBPUSD=X
            slug: gbpusd
            csv: GBPUSD_X_1h.csv
            daily_csv: GBPUSD_X_1d.csv
          - symbol: AUDUSD=X
            slug: audusd
            csv: AUDUSD_X_1h.csv
            daily_csv: AUDUSD_X_1d.csv
          - symbol: NZDUSD=X
            slug: nzdusd
            csv: NZDUSD_X_1h.csv
            daily_csv: NZDUSD_X_1d.csv
    steps:
      - name: Check out APEX
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install APEX without optional cloud integrations
        run: python -m pip install --no-deps -e .

      - name: Download historical data and train baseline model
        run: >-
          python -m apex.train_forex
          --symbol ${{ matrix.symbol }}
          --period 2y
          --interval 1h
          --data-dir data/forex
          --model-dir artifacts/forex-models

      - name: Run expanding walk-forward and cost stress tests
        run: >-
          python -m apex.backtest_forex
          --csv data/forex/${{ matrix.csv }}
          --symbol ${{ matrix.symbol }}
          --initial-train-bars 3000
          --test-bars 1800
          --max-folds 5
          --min-confidence 0.45
          --epochs 100
          --spread-bps-per-side 0.8
          --commission-bps-per-side 0.0
          --slippage-bps-per-side 0.2
          --report-dir artifacts/forex-backtests

      - name: Run V2 model comparison on unseen outer folds
        run: >-
          python -m apex.backtest_forex_v2
          --csv data/forex/${{ matrix.csv }}
          --symbol ${{ matrix.symbol }}
          --initial-train-bars 3000
          --test-bars 1800
          --max-folds 5
          --min-confidence 0.45
          --epochs 100
          --trees 13
          --spread-bps-per-side 0.8
          --commission-bps-per-side 0.0
          --slippage-bps-per-side 0.2
          --report-dir artifacts/forex-v2-backtests

      - name: Download ten-year daily history for the V3 date-locked experiment
        run: >-
          python -m apex.train_forex
          --symbol ${{ matrix.symbol }}
          --period 10y
          --interval 1d
          --data-dir data/forex-v3
          --model-dir artifacts/forex-v3-source-models
          --download-only

      - name: Run V3 calibration on the older daily holdout
        run: >-
          python -m apex.backtest_forex_v3
          --csv data/forex-v3/${{ matrix.daily_csv }}
          --symbol ${{ matrix.symbol }}
          --initial-train-bars 750
          --test-bars 250
          --max-folds 5
          --locked-test-end 2024-10-01
          --min-validation-trades 10
          --trees 13
          --spread-bps-per-side 0.8
          --commission-bps-per-side 0.0
          --slippage-bps-per-side 0.2
          --report-dir artifacts/forex-v3-backtests

      - name: Upload dataset, model and validation report
        uses: actions/upload-artifact@v4
        with:
          name: apex-${{ matrix.slug }}-validation-${{ github.run_id }}
          path: |
            data/forex/*
            artifacts/forex-models/*
            artifacts/forex-backtests/*
            artifacts/forex-v2-backtests/*
            data/forex-v3/*
            artifacts/forex-v3-source-models/*
            artifacts/forex-v3-backtests/*
          if-no-files-found: error
          retention-days: 30
